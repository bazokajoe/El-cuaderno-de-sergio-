<style>
:root{
  --ink:#0E1F1A; --muted:#5B7269; --line:#D2DFD7; --soft:#F7FAF8; --bg:#EEF3F0;
  --leaf:#118A56; --deep:#0B241E; --teal:#0E666B; --mint:#34D399; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:760px;margin:0 auto;padding-bottom:96px}
.hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px;padding:22px 20px 24px;color:#fff;
  background:linear-gradient(145deg,#071A15 0%,#0B241E 42%,#154034 100%)}
.hero:before{content:"";position:absolute;inset:-40px -20px auto auto;width:180px;height:180px;border-radius:50%;
  background:rgba(52,211,153,.18);filter:blur(30px)}
.hero > *{position:relative;z-index:1}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9DD4BF;margin:0}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em;margin:8px 0 0;font-size:2.05rem}
.sub{margin:8px 0 0;color:#CBE3D8;font-size:13.5px;line-height:1.4}
.pad{padding:16px 16px 0}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.grid3{display:grid;gap:10px}
.stat{display:flex;align-items:center;justify-content:space-between;border-radius:20px;padding:14px 16px;color:#fff;text-align:left}
.stat.todo{background:linear-gradient(135deg,#0B241E,#164033)}
.stat.doing{background:linear-gradient(135deg,#0E666B,#117A66)}
.stat.done{background:linear-gradient(135deg,#1A4E40,#245C4B)}
.stat .n{font-family:"Bricolage Grotesque",sans-serif;font-size:2.5rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.stat .t{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 8px;font-size:10.5px;font-weight:700}
.badge.y{background:#FEF08A;color:#633906}
.badge.g{background:#A7F3D0;color:#065F46}
.badge.w{background:rgba(255,255,255,.18);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--leaf);color:#fff;width:100%}
.btn.dark{background:var(--deep);color:#fff;width:100%}
.btn.ghost{background:#EEF4F1;color:var(--teal);padding:8px 10px;font-size:12px}
.btn.chip{border:1px solid var(--line);background:var(--soft);color:#243D34;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.btn.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.chip.riego.on{background:var(--teal);border-color:var(--teal)}
.btn:disabled{opacity:.45}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#536B62;margin-bottom:8px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #CEDCD4;background:var(--soft);border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--leaf);background:#fff;box-shadow:0 0 0 3px rgba(17,138,86,.16)}
.search{position:relative}
.search input{padding-left:36px}
.search:before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6B8279;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.meta{font-size:12.5px;color:var(--muted)}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;color:#526960}
.task{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;margin-bottom:10px}
.task.fresh{background:#fff}
.task.yellow{background:#FEF08A;border-color:rgba(202,138,4,.4)}
.task.orange{background:#FED09E;border-color:rgba(234,88,12,.4)}
.task.red{background:#FECACA;border-color:rgba(220,38,38,.4)}
.task.doing{background:#F1F9F5;border-color:#BBD9CC}
.task.done{background:#F7FAF8}
.tag-school{display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
.tag-riego{display:inline-flex;align-items:center;gap:6px;background:#E6F4F6;color:var(--teal);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.zone-pill{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;background:#F1F7F3;color:#2A463C;margin:0 6px 6px 0}
.zone-pill.school{background:rgba(254,243,199,.7);border:1px solid rgba(245,158,11,.35);color:#78350F}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(238,243,240,.92);backdrop-filter:blur(10px);border-top:1px solid rgba(210,223,215,.8)}
.nav-inner{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px}
.nav button{border-radius:12px;padding:10px 6px;font-size:11.5px;font-weight:700;color:#536B62}
.nav button.on{background:#E8F6EF;color:#0B5133}
.fab{position:fixed;right:18px;bottom:86px;z-index:40;width:56px;height:56px;border-radius:18px;background:var(--leaf);color:#fff;
  box-shadow:0 14px 28px -12px rgba(17,138,86,.7);font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.fab-menu{position:fixed;right:18px;bottom:152px;z-index:40;display:grid;gap:8px}
.fab-menu button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px;box-shadow:0 10px 24px -16px rgba(7,26,21,.5);text-align:left}
.scrim{position:fixed;inset:0;background:rgba(7,26,21,.35);backdrop-filter:blur(1px);z-index:35}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);color:#D7ECE3;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.status-grid button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;color:#2A423A}
.status-grid button.on{border-color:var(--leaf);background:#E8F6EF;color:#0B5133}
.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}
.team-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:0}
.more{color:var(--teal);font-size:12.5px;font-weight:700;margin-top:8px}
.hidden{display:none!important}
@media(min-width:768px){.hero{border-radius:28px;margin-top:16px}.pad{padding-left:4px;padding-right:4px}.app{padding:0 16px 110px}}
</style>

const STORAGE_KEY = 'sergio-cuaderno-v1';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.tasks) && Array.isArray(parsed.zones) && Array.isArray(parsed.teams)) return parsed;
    }
  }catch(e){}
  return {
    zones: structuredClone(SEED.ZONES),
    teams: structuredClone(SEED.TEAMS),
    tasks: structuredClone(SEED.TASKS).map(t => ({...t})),
  };
}

let state = loadState();
let screen = { name:'dashboard' };
let fabOpen = false;
let gestionQ = '';
let form = null;

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    zones: state.zones, teams: state.teams, tasks: state.tasks
  }));
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function zoneLabel(z){
  if(!z) return 'Zona';
  return z.code ? z.code + ' · ' + z.name : z.name;
}

function findZone(id){ return state.zones.find(z => z.id === id); }
function findTeam(id){ return state.teams.find(t => t.id === id); }

function zonesForTeam(team){
  if(!team || team.allZones) return state.zones;
  const set = new Set(team.zoneIds||[]);
  return state.zones.filter(z => set.has(z.id));
}

function typesForTeam(team){
  if(team && team.taskTypes && team.taskTypes.length) return team.taskTypes;
  return SEED.GARDEN_TYPES;
}

function deviceDateISO(d=new Date()){
  return d.toISOString().slice(0,10);
}

function formatDisplayDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  if(!y||!m||!d) return iso;
  return new Date(y,m-1,d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
}

function nextCode(){
  const nums = state.tasks.map(t => Number(String(t.code).replace(/\D/g,''))).filter(n => !Number.isNaN(n));
  return 'TAR-' + ((nums.length ? Math.max(...nums) : 200) + 1);
}

function counts(){
  return {
    TODO: state.tasks.filter(t=>t.status==='TODO').length,
    DOING: state.tasks.filter(t=>t.status==='DOING').length,
    DONE: state.tasks.filter(t=>t.status==='DONE').length,
  };
}

function ageTier(createdAt){
  const days = (Date.now()-createdAt)/(86400000);
  if(days>3) return 'red';
  if(days>2) return 'orange';
  if(days>1) return 'yellow';
  return 'fresh';
}

function greeting(){
  const h = new Date().getHours();
  if(h>=6 && h<14) return 'Buenos días';
  if(h>=14 && h<21) return 'Buenas tardes';
  return 'Buenas noches';
}

function go(s){ screen = s; fabOpen = false; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function ensureForm(task){
  const teamId = task?.teamId || state.teams[0]?.id || '';
  const team = findTeam(teamId);
  const types = typesForTeam(team);
  const zones = zonesForTeam(team);
  form = {
    mode: task ? 'edit' : 'create',
    taskId: task?.id || null,
    teamId,
    taskType: task?.taskType || types[0] || '',
    zoneId: task?.zoneId || zones[0]?.id || '',
    status: task?.status || 'TODO',
    comment: task?.comment || '',
    zoneQ: '',
    date: task?.date || deviceDateISO(),
  };
}

function saveTask(){
  const team = findTeam(form.teamId);
  const types = typesForTeam(team);
  let zones = zonesForTeam(team);
  const q = form.zoneQ.trim().toLowerCase();
  if(q) zones = zones.filter(z => (`${z.code||''} ${z.name} ${z.tag||''}`).toLowerCase().includes(q));
  const zoneId = zones.some(z=>z.id===form.zoneId) ? form.zoneId : (zones[0]?.id || '');
  const taskType = types.includes(form.taskType) ? form.taskType : (types[0]||'');
  if(!team || !zoneId || !taskType) return;
  const now = Date.now();
  if(form.mode==='edit' && form.taskId){
    state.tasks = state.tasks.map(t => t.id===form.taskId ? {...t, teamId:form.teamId, zoneId, taskType, status:form.status, comment:form.comment.trim(), updatedAt:now} : t);
    save();
    go({name:'list', status:form.status});
    return;
  }
  const created = {
    id: 't-'+now, code: nextCode(), createdAt: now, updatedAt: now,
    teamId: form.teamId, zoneId, taskType, status: form.status,
    comment: form.comment.trim(), date: form.date,
  };
  state.tasks = [created, ...state.tasks];
  save();
  go({name:'list', status:form.status});
}

function schoolCount(){ return state.zones.filter(z=>z.tag===SEED.SCHOOL).length; }

  return `
  <header class="hero">
    <button class="back" data-back>← Dashboard</button>

  </header>

    ${tasks.length===0?'<p class="empty">No hay tareas en este estado.</p>':tasks.map(t=>{
      const team = findTeam(t.teamId);
      const zone = findZone(t.zoneId);
      const cls = status==='TODO'?ageTier(t.createdAt):(status==='DOING'?'doing':'done');
      return `<button class="task ${cls}" data-edit="${esc(t.id)}">
        <div class="row"><div><div class="mono">${esc(t.code)} · ${esc(formatDisplayDate(t.date))}</div>
        <div style="font-size:16px;font-weight:700;margin-top:4px">${esc(t.taskType)}</div></div>
        <span class="btn ghost">Editar</span></div>
        <div class="meta" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">
          <span>${esc(team?.name||'Equipo')}</span>
          <span>${esc(zoneLabel(zone))}</span>
          ${zone?.tag?`<span class="tag-school">${esc(zone.tag)}</span>`:''}
        </div>
        ${t.comment?`<p class="meta" style="margin:8px 0 0">${esc(t.comment)}</p>`:''}
      </button>`;
    }).join('')}
  </div>`;
}

  const q = gestionQ.trim().toLowerCase();
  return `
  <header class="hero">

  for(const t of state.tasks){
    const team = findTeam(t.teamId)?.name || 'Equipo';
    groups[team] = groups[team] || {todo:0,doing:0,done:0};
    if(t.status==='TODO') groups[team].todo++;
    if(t.status==='DOING') groups[team].doing++;
    if(t.status==='DONE') groups[team].done++;
  }
  const rows = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'es'));
  return `
  <header class="hero">
    <p class="eyebrow">Análisis de campo</p>
    <h1>Reportes</h1>
    <p class="sub">Resumen por equipo sobre este dispositivo.</p>
  </header>
  <div class="pad">
    <div class="card">
      <div class="row" style="margin-bottom:8px"><strong>Por equipo</strong><span class="mono">${state.tasks.length} registros</span></div>
      ${rows.length===0?'<p class="empty">Sin datos.</p>':rows.map(([label,r])=>`
        <div class="row" style="padding:10px 0;border-top:1px solid #E4EDE8">
          <div><div style="font-weight:700">${esc(label)}</div><div class="meta">Total ${r.todo+r.doing+r.done}</div></div>
          <div class="mono" style="display:flex;gap:6px">
            <span style="background:#FEF08A;padding:2px 6px;border-radius:6px">${r.todo}</span>
            <span style="background:#D1FAE5;padding:2px 6px;border-radius:6px">${r.doing}</span>
            <span style="background:#E8EEF0;padding:2px 6px;border-radius:6px">${r.done}</span>
          </div>
        </div>`).join('')}
    </div>
    <button class="btn dark" id="reset-data">Restablecer datos de ejemplo</button>
  </div>`;
}

function activeTab(){
  if(screen.name==='gestion') return 'gestion';
  if(screen.name==='enviar') return 'enviar';
  if(screen.name==='reportes') return 'reportes';
  return 'inicio';
}

function render(){
  const root = document.getElementById('app');
  let body = '';
  if(screen.name==='dashboard') body = renderDashboard();
  else if(screen.name==='list') body = renderList(screen.status);
  else if(screen.name==='gestion') body = renderGestion();
  else if(screen.name==='form') body = renderForm();
  else if(screen.name==='enviar') body = renderEnviar();
  else if(screen.name==='reportes') body = renderReportes();
  root.innerHTML = body + renderFab() + renderNav(activeTab());
  bind();
}

function bind(){
  document.getElementById('fab')?.addEventListener('click', ()=>{ fabOpen=!fabOpen; render(); });
  document.getElementById('scrim')?.addEventListener('click', ()=>{ fabOpen=false; render(); });
  document.querySelectorAll('[data-fab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = btn.getAttribute('data-fab');
      if(a==='nueva-tarea'){ ensureForm(null); go({name:'form'}); }
      else if(a==='gestion') go({name:'gestion'});
      else if(a==='enviar') go({name:'enviar'});
      else if(a==='reportes') go({name:'reportes'});
    });
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.getAttribute('data-nav');
      if(t==='inicio') go({name:'dashboard'});
      if(t==='gestion') go({name:'gestion'});
      if(t==='enviar') go({name:'enviar'});
      if(t==='reportes') go({name:'reportes'});
    });
  });
  document.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=> go({name:'list', status:btn.getAttribute('data-open')}));
  });
  document.querySelectorAll('[data-back]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(screen.name==='form' && form?.mode==='edit') go({name:'list', status:form.status});
      else go({name:'dashboard'});
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const task = state.tasks.find(t=>t.id===btn.getAttribute('data-edit'));
      if(!task) return;
      ensureForm(task);
      go({name:'form'});
    });
  });
  const gq = document.getElementById('gestion-q');
  if(gq){
    gq.addEventListener('input', e=>{ gestionQ = e.target.value; render(); const el=document.getElementById('gestion-q'); if(el){ el.focus(); el.setSelectionRange(gestionQ.length, gestionQ.length);} });
  }
  const teamSel = document.getElementById('f-team');
  if(teamSel){
    teamSel.addEventListener('change', e=>{
      form.teamId = e.target.value;
      form.zoneQ = '';
      const team = findTeam(form.teamId);
      const types = typesForTeam(team);
      form.taskType = types[0]||'';
      const zones = zonesForTeam(team);
      form.zoneId = zones[0]?.id || '';
      render();
    });
  }
  document.querySelectorAll('[data-type]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ form.taskType = btn.getAttribute('data-type'); render(); });
  });
  document.querySelectorAll('[data-status]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ form.status = btn.getAttribute('data-status'); render(); });
  });
  const zq = document.getElementById('f-zoneq');
  if(zq){
    zq.addEventListener('input', e=>{ form.zoneQ = e.target.value; render(); const el=document.getElementById('f-zoneq'); if(el){ el.focus(); el.setSelectionRange(form.zoneQ.length, form.zoneQ.length);} });
  }
  const zs = document.getElementById('f-zone');
  if(zs){ zs.addEventListener('change', e=>{ form.zoneId = e.target.value; }); }
  const cm = document.getElementById('f-comment');
  if(cm){ cm.addEventListener('input', e=>{ form.comment = e.target.value; }); }
  document.getElementById('f-save')?.addEventListener('click', saveTask);
  document.getElementById('reset-data')?.addEventListener('click', ()=>{
    if(!confirm('¿Restablecer equipos, zonas y tareas de ejemplo?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    go({name:'dashboard'});
  });
}

render();
</script>
</body>
</html>
